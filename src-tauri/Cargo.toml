[package]
name = "retention-planner"
version = "0.1.0"
description = "목표한 날까지 기억을 붙잡아 두는 학습 플래너"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "retention_planner_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-notification = "2"
serde_json = "1.0.151"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
